# Park 在开头说清楚的东西。AI 不猜：缺字段就停下来问。
video_type: 横屏口播            # 横屏口播 / 竖屏口播 / 竖屏分屏口播 …
canvas: [1920, 1080]
motion_placement: overlay-sides  # overlay-sides（人脸居中，透明叠在两侧）/ broll（切走人脸）/ fullscreen（盖满）
no_motion:                       # 不加动效的时间段（秒），比如录屏 / 分屏段
  - [312.9, 565.4]
captions_burned_in: true         # 字幕已在剪映里烧进画面：不再渲染，动效避开字幕带
caption_band: [868, 1000]        # 字幕带 y 范围（从真实画面量）
face_box: [700, 140, 520, 760]   # 人脸 x, y, w, h（从真实画面量）；overlay-sides 时两侧区域由它推出
sfx: low                         # none / low / mid / high
bgm: none                        # none / light
