# 风格和规则的默认值：填一次，每条视频沿用。某条视频要不一样，就在它的 v2/brief.yaml 里写同名字段覆盖。
# 不能出现在画面上的词（客户名、地名…）只写在各项目的 brief.yaml 里，不写进这个公开仓库。

# 两把主旋钮
density: medium          # 密度＝动效占可加动效时长的比例：low 10–20% / medium 30–40% / high 50% 以上（出样片前检查）
effort: b                # 努力程度＝每张动效花多少功夫：a 文字卡 / b 图表、示意图、图标、曲线 / c 层次丰富、像专业 AE / d 先用 Codex 画图再做动画

# 长什么样
card: glass              # glass 毛玻璃半透明 / paper 米白纸卡 / dark 深色卡 / none 无卡片，字直接浮在画面上
accent: "#E2461F"        # 强调色（朱红）
text_amount: one-point   # one-point 一张卡一个重点，大字 / points 标题加几条要点
max_items: 3             # 一张卡最多几条（行、步骤、节点、条形……）

# 怎么出现、什么时候走
overshoot: false         # 数字、指针、圆点能不能冲过头再弹回
exit: until-next         # until-next 停到下一张出来（最多停到最后一句说完后 10 秒）/ after-sentence 这句话说完就走
min_gap: 2               # 两张卡之间至少留多少秒纯人脸

# 卡片上的字
rewrite: trim-only       # trim-only 只能删减你的原话、不能换词 / summarize 允许概括
